<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chengappa Thumisi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            /* Plain white/light neutral color gradient */
            background: linear-gradient(-45deg, #ffffff, #f4f6f8, #e9ecef, #f8f9fa, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Subtle smooth transition between white-related shades */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card container styled to match the clean white theme */
        .card {
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            color: #800080;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">CHENGAPPA THUMISI</h1>
    </div>

</body>
</html>
